name: MAJ points Root-Me
on:
  schedule:
    - cron: "17 */6 * * *"    # toutes les 6 h
  workflow_dispatch:           # bouton pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rootme.py
        env:
          ROOTME_KEY: ${{ secrets.ROOTME_KEY }}
          ROOTME_ID: ${{ secrets.ROOTME_ID }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/rootme.json
          git diff --cached --quiet || git commit -m "MAJ points Root-Me"
          git push